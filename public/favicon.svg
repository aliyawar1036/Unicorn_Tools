<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <!-- Minimalist crystalline geometric unicorn icon with indigo-violet gradient -->
  <defs>
    <linearGradient id="unicornHornPrimary" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="unicornFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#4338CA" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="basePlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>
  <!-- Background rounded soft plate -->
  <rect width="48" height="48" rx="12" fill="url(#basePlate)" />
  
  <!-- Geometric crystalline unicorn horn facets -->
  <polygon points="24,6 34,36 24,32" fill="url(#unicornHornPrimary)" />
  <polygon points="24,6 14,36 24,32" fill="url(#unicornFacet)" />
  <polygon points="24,32 34,36 24,42 14,36" fill="#312E81" />
  <circle cx="24" cy="7" r="1.5" fill="#E0E7FF" />
</svg>
